name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x86_64 }
          - { os: ubuntu-latest,    name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison autoconf clang git python3 make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf

      - name: Build
        run: make

      - name: Smoke test
        run: tools/smoke_test.sh

      - name: Package
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          dir="psyq-sdk-${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp -a bin "$dir/bin"
          cp LICENSE THIRD_PARTY.md README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          (command -v sha256sum >/dev/null && sha256sum "$dir.tar.gz" || shasum -a 256 "$dir.tar.gz") > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: psyq-sdk-${{ matrix.name }}
          path: psyq-sdk-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: psyq-sdk-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes psyq-sdk-*.tar.gz*
